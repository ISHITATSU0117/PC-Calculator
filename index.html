<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV解析アプリ - 管理画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
            text-align: center;
        }

        .nav-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .nav-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .nav-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transform: translateY(-3px);
        }

        .nav-card .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .nav-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .nav-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .control-panel {
            background: #fff8e1;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .control-panel h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: white;
            border-radius: 6px;
        }

        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .auto-refresh label {
            cursor: pointer;
            font-size: 15px;
            color: #333;
        }

        .config-section {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .config-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .config-section h2:hover {
            color: #1976d2;
        }

        .toggle-icon {
            transition: transform 0.3s ease;
        }

        .toggle-icon.collapsed {
            transform: rotate(-90deg);
        }

        .config-form {
            display: grid;
            gap: 15px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
        }

        .config-form.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin-top: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 CSV解析アプリ - 管理画面</h1>
        <p class="subtitle">通過時間計測システムの管理と設定</p>

        <!-- 設定セクション -->
        <div class="config-section">
            <h2 onclick="toggleConfigSection()">
                <span>⚙️ GitHub設定</span>
                <span class="toggle-icon collapsed" id="toggleIcon">▼</span>
            </h2>
            <div class="config-form collapsed" id="configForm">
                <div class="form-group">
                    <label>Personal Access Token（アップロード・削除に必要）</label>
                    <input type="password" id="githubToken" placeholder="ghp_...">
                </div>
                <div class="form-group">
                    <label>データ保存用リポジトリ オーナー名（未入力の場合は制御用リポジトリのオーナーを使用）</label>
                    <input type="text" id="dataGithubOwner" placeholder="例: username">
                </div>
                <div class="form-group">
                    <label>データ保存用リポジトリ名（CSVファイルを保存する別リポジトリ）</label>
                    <input type="text" id="dataGithubRepo" placeholder="例: csv-data">
                </div>
                <button onclick="saveConfig()">💾 設定を保存</button>
            </div>
            <div id="configStatus"></div>
        </div>

        <!-- ナビゲーション -->
        <div class="nav-section">
            <h2>📑 ページ</h2>
            <div class="nav-grid">
                <a href="results.html" class="nav-card">
                    <div class="icon">📊</div>
                    <h3>結果公開ページ</h3>
                    <p>計算結果を表示<br>（一般公開用）</p>
                </a>
                <a href="upload.html" class="nav-card">
                    <div class="icon">📤</div>
                    <h3>ファイルアップロード</h3>
                    <p>CSVファイルを<br>アップロード</p>
                </a>
                <a href="manage.html" class="nav-card">
                    <div class="icon">📁</div>
                    <h3>ファイル管理</h3>
                    <p>アップロードファイルの<br>確認・削除</p>
                </a>
                <a href="upload-section.html" class="nav-card">
                    <div class="icon">⚙️</div>
                    <h3>区間設定アップロード</h3>
                    <p>section.csvファイルを<br>アップロード</p>
                </a>
                <a href="section-settings.html" class="nav-card">
                    <div class="icon">📝</div>
                    <h3>区間設定管理</h3>
                    <p>区間設定の確認・編集<br>手動で追加・修正可能</p>
                </a>
            </div>
        </div>

        <!-- 計算制御 -->
        <div class="control-panel">
            <h2>🔄 計算制御</h2>
            <div class="control-buttons">
                <button onclick="executeCalculation()">手動計算実行</button>
                <div class="auto-refresh">
                    <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                    <label for="autoRefresh">自動計算（2分ごと）</label>
                </div>
            </div>
            <div id="calcStatus"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="calculator.js"></script>
    <script>
        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', () => {
            loadConfigToForm();
            checkAutoRefreshStatus();
            initializeConfigSection();
        });

        // 設定セクションの初期化（最初は折りたたむ）
        function initializeConfigSection() {
            const configForm = document.getElementById('configForm');
            const toggleIcon = document.getElementById('toggleIcon');
            // 初期状態は折りたたまれている
            configForm.classList.add('collapsed');
            toggleIcon.classList.add('collapsed');
        }

        // 設定セクションの展開/折りたたみ
        function toggleConfigSection() {
            const configForm = document.getElementById('configForm');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (configForm.classList.contains('collapsed')) {
                // 展開する - まず高さを計算してから設定
                const height = configForm.scrollHeight;
                configForm.style.maxHeight = height + 'px';
                configForm.classList.remove('collapsed');
                toggleIcon.classList.remove('collapsed');
                
                // アニメーション完了後にmaxHeightを削除（動的コンテンツ対応）
                setTimeout(() => {
                    if (!configForm.classList.contains('collapsed')) {
                        configForm.style.maxHeight = 'none';
                    }
                }, 300);
            } else {
                // 折りたたむ - まず現在の高さを設定してからアニメーション
                configForm.style.maxHeight = configForm.scrollHeight + 'px';
                // 強制的にリフローを発生させる
                configForm.offsetHeight;
                configForm.style.maxHeight = '0';
                configForm.classList.add('collapsed');
                toggleIcon.classList.add('collapsed');
            }
        }

        // 設定をフォームに読み込む
        function loadConfigToForm() {
            const config = ConfigManager.load();
            document.getElementById('githubToken').value = config.token || '';
            document.getElementById('dataGithubOwner').value = localStorage.getItem(CONFIG.STORAGE_KEYS.DATA_GITHUB_OWNER) || '';
            document.getElementById('dataGithubRepo').value = config.dataRepo || '';
        }

        // 設定を保存
        function saveConfig() {
            const config = {
                token: document.getElementById('githubToken').value.trim(),
                dataOwner: document.getElementById('dataGithubOwner').value.trim(),
                dataRepo: document.getElementById('dataGithubRepo').value.trim()
            };

            ConfigManager.save(config);
            showStatus('configStatus', '設定を保存しました', 'success');
        }

        // 手動計算実行
        async function executeCalculation() {
            if (!ConfigManager.isConfigured()) {
                showStatus('calcStatus', 'GitHub設定を完了してください', 'warning');
                return;
            }

            showStatus('calcStatus', '計算を実行中...', 'info');

            const result = await Calculator.calculate();

            if (result.success) {
                let message = `計算完了: ${result.fileCount}ファイル、${result.bibData.length}ゼッケン`;
                let statusType = 'success';
                let hasErrors = false;
                
                // 区間重複エラーがある場合
                if (result.overlaps && result.overlaps.length > 0) {
                    statusType = 'error';
                    hasErrors = true;
                    message = '⚠️ エラー: ファイル名で区間の重複があります\n\n';
                    result.overlaps.forEach(overlap => {
                        message += `• ${overlap.file1} と ${overlap.file2} で ${overlap.section}${overlap.type} が重複しています\n`;
                    });
                    message += '\n重複している区間の時刻は表示されません。\n同じ区間の同じタイプ（START/GOAL）は1つのファイルにのみ含めてください。';
                }
                
                // ゼッケン番号重複エラーがある場合
                if (result.bibNumberDuplicates && result.bibNumberDuplicates.length > 0) {
                    statusType = 'error';
                    if (hasErrors) {
                        message += '\n\n';
                    } else {
                        message = '';
                        hasErrors = true;
                    }
                    message += '⚠️ エラー: 同じ区間で同じゼッケン番号が複数回出現しています\n\n';
                    result.bibNumberDuplicates.forEach(dup => {
                        message += `• ゼッケン ${dup.bibNumber} が ${dup.section}${dup.type} で複数回出現: ${dup.files.join(', ')}\n`;
                    });
                    message += '\n重複しているゼッケンの時刻は表示されません。';
                }
                
                // section.csvに設定されていないファイルがある場合
                if (result.unmatchedFiles && result.unmatchedFiles.length > 0) {
                    statusType = 'error';
                    if (hasErrors) {
                        message += '\n\n';
                    } else {
                        message = '';
                        hasErrors = true;
                    }
                    message += '⚠️ エラー: section.csvに設定されていない区間のCSVファイルがあります\n\n';
                    result.unmatchedFiles.forEach(file => {
                        message += `• ${file}\n`;
                    });
                    message += '\nこれらのファイルは結果に表示されません。section.csvに区間を追加してください。';
                }
                
                // エラーがない場合は成功メッセージ
                if (!hasErrors) {
                    message = `✅ 計算完了: ${result.fileCount}ファイル、${result.bibData.length}ゼッケン\n\n結果はサーバー（GitHub）に保存されました。\nユーザーはresults.htmlから結果を閲覧できます。`;
                } else {
                    // エラーがある場合も保存は完了したことを通知
                    message += '\n\n計算結果はサーバー（GitHub）に保存されました。';
                }
                
                showStatus('calcStatus', message, statusType);
            } else {
                showStatus('calcStatus', `エラー: ${result.error}`, 'error');
            }
        }

        // 自動更新の切り替え
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                localStorage.setItem('autoRefreshEnabled', 'true');
                startAutoRefresh();
                showStatus('calcStatus', '自動計算を開始しました（2分ごと）', 'success');
            } else {
                localStorage.setItem('autoRefreshEnabled', 'false');
                stopAutoRefresh();
                showStatus('calcStatus', '自動計算を停止しました', 'info');
            }
        }

        // 自動更新を開始
        let autoRefreshInterval = null;
        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            
            autoRefreshInterval = setInterval(async () => {
                await executeCalculation();
            }, CONFIG.AUTO_REFRESH_INTERVAL);
        }

        // 自動更新を停止
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // 自動更新の状態を確認
        function checkAutoRefreshStatus() {
            const enabled = localStorage.getItem('autoRefreshEnabled') === 'true';
            document.getElementById('autoRefresh').checked = enabled;
            if (enabled && ConfigManager.isConfigured()) {
                startAutoRefresh();
            }
        }

        // ステータスメッセージ表示
        function showStatus(elementId, message, type) {
            const statusDiv = document.getElementById(elementId);
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
